<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Выборы старосты</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-glow"></div>

  <!-- ЭКРАН 1: ВЫБОР РОЛИ -->
  <div id="roleScreen" class="role-wrapper">
    <div class="role-card">
      <div class="role-icon">🗳️</div>
      <h2>Выборы старосты</h2>
      <p class="role-hint">Кто вы?</p>

      <button class="role-btn" id="voterBtn">
        <div class="role-title">Голосующий</div>
        <div class="role-desc">Войти и проголосовать</div>
      </button>

      <button class="role-btn" id="candidateBtn">
        <div class="role-title">Кандидат</div>
        <div class="role-desc">Нужен специальный код</div>
      </button>

      <a href="admin.html" class="role-admin-link">admin</a>
    </div>
  </div>

  <!-- ЭКРАН 2: ВВОД КОДА КАНДИДАТА -->
  <div id="codeScreen" class="role-wrapper" hidden>
    <div class="role-card">
      <div class="role-icon">🎫</div>
      <h2>Введите код</h2>
      <p class="role-hint">Код выдал организатор выборов</p>

      <input type="text" id="candidateCodeInput" placeholder="cand-xxxxxxxx-xxxx-…" autocomplete="off" class="role-input">
      <button class="btn login-btn" id="codeSubmitBtn">Войти</button>
      <div class="login-error" id="codeError"></div>

      <button class="role-back-btn" id="codeBackBtn">← Назад</button>
    </div>
  </div>

  <!-- ЭКРАН 3: ГОЛОСОВАНИЕ -->
  <main id="voteScreen" class="container" hidden>
    <header class="header">
      <div class="badge" id="roleBadge">Голосующий</div>
      <h1>Выберите кандидата</h1>
      <p class="subtitle">Голос нельзя изменить.</p>
    </header>

    <section id="winnerBanner" class="winner-banner" hidden>
      <div class="badge badge-success">Итоги подведены</div>
      <h2 id="winnerName"></h2>
      <div id="winnerStats" class="winner-stats"></div>
    </section>

    <section id="candidates" class="candidates">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </section>

    <button id="voteBtn" class="vote-btn" disabled>
      <span>Проголосовать</span>
    </button>

    <div id="msg" class="msg" hidden></div>

    <footer class="footer">
      <span id="status">Загрузка…</span>
      <a href="#" class="link-dim" id="exitBtn">← Выйти</a>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
